<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ito 配札アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 1カラムの卓上カード。赤い糸が見出しとカードをつなぐ */
:root {
  --paper: #edf0f5;
  --card: #ffffff;
  --ink: #1a2140;
  --ink-2: #5a6384;
  --line: #cbd2e2;
  --thread: #d93a4a;
  --on-thread: #ffffff;
  --shadow: 0 10px 30px -14px rgba(26, 33, 64, .35);
  --f-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1426; --card: #192040; --ink: #e9edf8; --ink-2: #9aa4c6;
    --line: #2c3560; --thread: #ff6475; --on-thread: #1a0b10;
    --shadow: 0 10px 30px -14px rgba(0, 0, 0, .7); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1426; --card: #192040; --ink: #e9edf8; --ink-2: #9aa4c6;
  --line: #2c3560; --thread: #ff6475; --on-thread: #1a0b10;
  --shadow: 0 10px 30px -14px rgba(0, 0, 0, .7); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7; padding-inline: 16px; padding-block: 24px 48px; }
.wrap { max-width: 34rem; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: 3.2rem; line-height: 1; margin: 0; letter-spacing: .02em; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.25rem; margin: 0; text-wrap: balance; }
p { margin: 0; }
.sub { color: var(--ink-2); font-size: .85rem; }
.head { display: flex; flex-direction: column; gap: 4px; }
.thread { width: 100%; height: 28px; display: block; overflow: visible; }
.thread path { fill: none; stroke: var(--thread); stroke-width: 2; stroke-linecap: round; }
.thread circle { fill: var(--thread); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
label, .lbl { font-size: .78rem; font-weight: 700; letter-spacing: .08em; color: var(--ink-2); }
.row { display: flex; gap: 8px; align-items: stretch; min-width: 0; }
.row > * { min-width: 0; }
input[type=text] { flex: 1; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; width: 100%; }
input[disabled] { opacity: .7; }
button { font: inherit; cursor: pointer; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 9px 14px; white-space: nowrap; }
button:hover:not([disabled]) { border-color: var(--ink-2); }
button[disabled] { opacity: .4; cursor: not-allowed; }
button.main { background: var(--thread); color: var(--on-thread); border-color: var(--thread); font-weight: 700; padding: 12px 16px; }
:focus-visible { outline: 3px solid var(--thread); outline-offset: 2px; }
.stepper { display: flex; align-items: center; gap: 12px; }
.stepper output { font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; min-width: 2.2ch; text-align: center; font-variant-numeric: tabular-nums; }
.stepper button { width: 42px; padding: 6px 0; font-size: 1.1rem; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; }
.chips button { padding: 10px 0; font-variant-numeric: tabular-nums; font-weight: 700; }
.chips button[aria-pressed=true] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.topics { display: flex; flex-direction: column; gap: 10px; }
.topics button { text-align: left; white-space: normal; padding: 16px 18px; font-family: var(--f-display); font-weight: 600; font-size: 1.15rem; display: flex; gap: 12px; align-items: baseline; background: var(--card); }
.topics button small { font-family: var(--f-body); font-size: .72rem; color: var(--ink-2); letter-spacing: .1em; }
.topics button[aria-pressed=true] { border-color: var(--thread); box-shadow: inset 0 0 0 2px var(--thread); }
.topic-now { display: flex; flex-direction: column; gap: 2px; }
.topic-now h2 { font-size: 1.6rem; }
.hand { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); min-height: 17rem; display: grid; place-items: center; width: 100%; padding: 24px; }
.hand::before { content: ""; position: absolute; top: -9px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--thread); }
.hand .num { font-family: var(--f-display); font-weight: 800; font-size: 8rem; line-height: 1; font-variant-numeric: tabular-nums; }
.hand .hide { color: var(--ink-2); text-align: center; }
.hand .hide b { display: block; font-family: var(--f-display); font-size: 3rem; line-height: 1.2; color: var(--line); }
.scale { display: flex; justify-content: space-between; font-size: .78rem; color: var(--ink-2); }
.meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--ink-2); font-size: .85rem; font-variant-numeric: tabular-nums; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.note { font-size: .8rem; color: var(--ink-2); }
@media (prefers-reduced-motion: no-preference) { .hand .num { animation: pop .25s ease-out; } @keyframes pop { from { transform: scale(.92); opacity: 0; } } }
</style>

<main class="wrap">
  <header class="head">
    <h1>ito</h1>
    <svg class="thread" viewBox="0 0 400 28" preserveAspectRatio="none" aria-hidden="true"><path d="M2 8 C 90 30, 160 -8, 250 14 S 370 22, 398 6"/><circle cx="2" cy="8" r="4"/><circle cx="398" cy="6" r="4"/></svg>
    <p class="sub">数字を言わずに、お題の言葉だけで小さい順に並べるゲーム。ここでは配札とお題決めを行います。</p>
  </header>

  <section id="lobby" class="wrap" style="gap:20px">
    <div class="panel" id="roomPanel">
      <h2 id="roomTitle">部屋を作る</h2>
      <div>
        <label>参加人数</label>
        <div class="stepper"><button id="minus" aria-label="人数を減らす">−</button><output id="nOut">4</output><button id="plus" aria-label="人数を増やす">＋</button></div>
      </div>
      <div>
        <label for="seed">シード値</label>
        <div class="row"><input type="text" id="seed" autocomplete="off" spellcheck="false"><button id="rand">ランダム</button></div>
      </div>
      <div id="shareBox" style="display:flex;flex-direction:column;gap:12px">
        <div>
          <label for="link">配布用URL（参加番号は未入力）</label>
          <div class="row"><input type="text" id="link" readonly><button id="copyLink">コピー</button></div>
        </div>
        <div>
          <label for="code">参加コード（URLが開けない環境用）</label>
          <div class="row"><input type="text" id="code" readonly><button id="copyCode">コピー</button></div>
        </div>
        <p class="note">URLを開いた人は人数とシード値が入力済みの状態になり、参加番号だけ選びます。</p>
      </div>
      <div id="joinByCode">
        <label for="codeIn">コードで参加する</label>
        <div class="row"><input type="text" id="codeIn" placeholder="例: 4-ab12cd" autocomplete="off"><button id="loadCode">読み込む</button></div>
        <p class="note" id="codeErr" hidden style="color:var(--thread)"></p>
      </div>
    </div>

    <div class="panel">
      <h2>自分の参加番号</h2>
      <div class="chips" id="chips"></div>
      <button class="main" id="start" disabled>ゲーム開始</button>
    </div>
  </section>

  <section id="topicScr" class="wrap" hidden style="gap:16px">
    <div class="head"><h2>お題を選ぶ</h2><p class="sub" id="topicSub">3つの候補です。全員で相談して、同じお題を選んでください。</p></div>
    <div class="topics" id="topics"></div>
    <button class="main" id="go" disabled>このお題で始める</button>
  </section>

  <section id="playScr" class="wrap" hidden style="gap:16px">
    <div class="topic-now"><span class="lbl">お題 / ROUND <span id="roundOut">1</span></span><h2 id="topicNow"></h2></div>
    <button class="hand" id="hand" aria-live="polite"></button>
    <div class="scale"><span>1 小さい</span><span>大きい 100</span></div>
    <div class="meta"><span id="who"></span><span>他の人に見えない向きで確認</span></div>
    <div class="actions">
      <button id="next">次のラウンド</button>
      <button id="reselect">お題を選び直す</button>
      <button id="leave">最初に戻る</button>
    </div>
  </section>
</main>

<script>
/*LOGIC*/
// 文字列→32bitハッシュ→mulberry32。同じシード文字列なら全端末で同じ乱数列になる
function xmur3(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  return function () { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return (h ^= h >>> 16) >>> 0; };
}
function mulberry32(a) {
  return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function makeRng(s) { return mulberry32(xmur3(s)()); }

// デッキ(1〜100)からランダムに1枚ずつ抜き(remove)、配布用リストへappendする。
// 配布用リストは「抜いた順」のまま並べ、ソートしない。hands[参加番号-1] が各自の数字。
function deal(n, seed, round) {
  const rng = makeRng(seed + '|' + n + '|' + round + '|deal');
  const deck = Array.from({ length: 100 }, (_, i) => i + 1);
  const hands = [];
  for (let i = 0; i < n; i++) {
    const k = Math.floor(rng() * deck.length);
    hands.push(deck.splice(k, 1)[0]);
  }
  return hands;
}
function pickTopics(words, n, seed, round) {
  const rng = makeRng(seed + '|' + n + '|' + round + '|topic');
  const pool = words.slice(), out = [];
  while (out.length < 3 && pool.length) out.push(pool.splice(Math.floor(rng() * pool.length), 1)[0]);
  return out;
}
function parseCode(s) {
  const m = /^\s*(\d+)\s*[-:]\s*(.+?)\s*$/.exec(s || '');
  if (!m) return null;
  const n = +m[1];
  return n >= 2 && n <= 12 ? { n, seed: m[2] } : null;
}
/*END*/

const FALLBACK_WORDS = ["怖いもの","大きいもの","重いもの","速いもの","高そうなもの","強い生き物","暑い夏に欲しいもの","無人島に持っていきたいもの","お金持ちが持っていそうなもの","旅行に持っていくと嬉しいもの","モテる習い事","子どもに人気のもの","朝一番にしたいこと","ドキドキする瞬間","かっこいい乗り物","美味しいおやつ","なくなると困るもの","寒い場所にあるもの","痛そうなもの","臭いもの","やわらかいもの","うるさいもの","めんどくさい家事","ワクワクする言葉","お弁当に入れたいもの","学校にあるもの","会社にあるもの","夜に会いたくないもの","温かいもの","長いもの","古いもの","有名な観光地","人気のある職業","眠くなるもの","笑える出来事","ご褒美に食べたいもの","雨の日に嫌なこと","夏祭りにあるもの","冬に食べたいもの","持っていると安心するもの"];
let words = FALLBACK_WORDS;
fetch('word.txt').then(r => r.ok ? r.text() : Promise.reject())
  .then(t => { const w = [...new Set(t.split(/\r?\n/).map(s => s.trim()).filter(Boolean))]; if (w.length >= 3) words = w; })
  .catch(() => {});

const $ = s => document.querySelector(s);
const S = { n: 4, seed: '', me: 0, round: 1, topics: [], chosen: -1, shown: false, locked: false };

function randSeed() {
  const c = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = '';
  for (let i = 0; i < 6; i++) s += c[Math.floor(Math.random() * c.length)];
  return s;
}
function show(id) { for (const x of ['lobby', 'topicScr', 'playScr']) $('#' + x).hidden = x !== id; }
function baseUrl() { return location.origin + location.pathname; }
function renderLobby() {
  $('#nOut').textContent = S.n;
  if (S.me > S.n) S.me = 0;
  const link = baseUrl() + '?n=' + S.n + '&seed=' + encodeURIComponent(S.seed);
  $('#link').value = S.seed ? link : '';
  $('#code').value = S.seed ? S.n + '-' + S.seed : '';
  $('#chips').innerHTML = '';
  for (let i = 1; i <= S.n; i++) {
    const b = document.createElement('button');
    b.textContent = i; b.setAttribute('aria-pressed', S.me === i);
    b.onclick = () => { S.me = i; renderLobby(); };
    $('#chips').appendChild(b);
  }
  $('#start').disabled = !(S.me && S.seed.trim());
  for (const id of ['minus', 'plus', 'seed', 'rand']) $('#' + id).disabled = S.locked;
  $('#shareBox').hidden = S.locked; $('#joinByCode').hidden = S.locked;
  $('#roomTitle').textContent = S.locked ? '部屋の設定（入力済み）' : '部屋を作る';
}
function openTopics() {
  S.topics = pickTopics(words, S.n, S.seed, S.round); S.chosen = -1;
  $('#topics').innerHTML = '';
  S.topics.forEach((t, i) => {
    const b = document.createElement('button');
    b.innerHTML = '<small>候補' + 'ABC'[i] + '</small><span></span>'; b.lastChild.textContent = t;
    b.setAttribute('aria-pressed', 'false');
    b.onclick = () => { S.chosen = i; [...$('#topics').children].forEach((c, j) => c.setAttribute('aria-pressed', j === i)); $('#go').disabled = false; };
    $('#topics').appendChild(b);
  });
  $('#go').disabled = true; show('topicScr');
}
function renderHand() {
  const v = deal(S.n, S.seed, S.round)[S.me - 1];
  $('#hand').innerHTML = S.shown ? '<span class="num">' + v + '</span>' : '<span class="hide"><b>？</b>タップして数字を見る</span>';
  $('#hand').setAttribute('aria-label', S.shown ? 'あなたの数字は' + v + '。タップで隠す' : 'タップして数字を見る');
}
function openPlay() {
  S.shown = false;
  $('#topicNow').textContent = S.topics[S.chosen]; $('#roundOut').textContent = S.round;
  $('#who').textContent = '参加番号 ' + S.me + ' / ' + S.n + '人';
  renderHand(); show('playScr');
}
async function copy(inputId, btn) {
  const el = $(inputId);
  try { await navigator.clipboard.writeText(el.value); btn.textContent = 'コピーしました'; }
  catch (e) { el.select(); btn.textContent = '選択しました'; }
  setTimeout(() => btn.textContent = 'コピー', 1500);
}

$('#minus').onclick = () => { S.n = Math.max(2, S.n - 1); renderLobby(); };
$('#plus').onclick = () => { S.n = Math.min(12, S.n + 1); renderLobby(); };
$('#seed').oninput = e => { S.seed = e.target.value.trim(); renderLobby(); };
$('#rand').onclick = () => { S.seed = randSeed(); $('#seed').value = S.seed; renderLobby(); };
$('#copyLink').onclick = e => copy('#link', e.target);
$('#copyCode').onclick = e => copy('#code', e.target);
$('#loadCode').onclick = () => {
  const r = parseCode($('#codeIn').value);
  $('#codeErr').hidden = !!r;
  if (!r) { $('#codeErr').textContent = '「人数-シード値」の形式で入力してください（例: 4-ab12cd）。人数は2〜12です。'; return; }
  S.n = r.n; S.seed = r.seed; $('#seed').value = r.seed; S.locked = true; renderLobby();
};
$('#start').onclick = () => { S.round = 1; openTopics(); };
$('#go').onclick = () => openPlay();
$('#hand').onclick = () => { S.shown = !S.shown; renderHand(); };
$('#next').onclick = () => { S.round++; openTopics(); };
$('#reselect').onclick = () => { $('#topicSub').textContent = '同じ候補から選び直せます。'; const keep = S.topics; openTopics(); };
$('#leave').onclick = () => { S.round = 1; show('lobby'); };

(function init() {
  const q = new URLSearchParams(location.search);
  const n = parseInt(q.get('n'), 10), seed = q.get('seed');
  if (n >= 2 && n <= 12 && seed) { S.n = n; S.seed = seed; S.locked = true; }
  else S.seed = randSeed();
  $('#seed').value = S.seed;
  renderLobby(); show('lobby');
})();
</script>

</body></html>
